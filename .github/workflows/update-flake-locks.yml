name: Update flake locks (stable)

# Pins each host flake.lock to github input revisions at least DELAY_DAYS old,
# opens a PR and merges it immediately.
# The merge lands the new pins on main;
# each host picks them up on its next sysconf-auto-pull.
# The hosts never compute their own revisions,
# so this is the single place updates enter the system.

on:
  schedule:
    - cron: "0 4 * * *" # Daily 04:00 UTC
  workflow_dispatch:
    inputs:
      delay_days:
        description: "Minimum age (days) of revisions to pin"
        default: "7"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update host flake locks to stable revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELAY_DAYS: ${{ github.event.inputs.delay_days || '7' }}
          # Outside the repo tree, so create-pull-request does not commit it.
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: bash .github/scripts/update-stable-locks.sh hosts/homelab hosts/vmk3s hosts/nixos hosts/pi-4b-hh hosts/netcup-g12

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/flake-lock-update
          delete-branch: true
          title: "chore: stable flake.lock update"
          commit-message: "chore: stable flake.lock update"
          body-path: ${{ runner.temp }}/pr-body.md

      # Merges without waiting on checks,
      # mirroring Renovate's ignoreTests automerge in hh-cluster-infra.
      - name: Merge pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --merge "${{ steps.cpr.outputs.pull-request-number }}"
