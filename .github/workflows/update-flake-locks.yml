name: Update flake locks (stable)

# Pins each host flake.lock to github input revisions at least DELAY_DAYS old,
# opens a PR, and lands the pins of every host in the build matrix that builds against them.
# With every host built, the PR merges.
# With a failed host, the other pins go straight to main and the run stays red.
# The PR stays open with the failed hosts, marked BROKEN with a link to the run,
# and the next run updates the same branch and retries.
# Landing puts the new pins on main, and each host picks them up on its next sysconf-auto-pull.
# The hosts never compute their own revisions,
# so this is the single place updates enter the system.

on:
  schedule:
    - cron: "0 4 * * *" # Daily 04:00 UTC
  workflow_dispatch:
    inputs:
      delay_days:
        description: "Minimum age (days) of revisions to pin"
        default: "7"
      build_main:
        description: "Build and cache main as it stands, without updating locks"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-locks:
    if: ${{ !inputs.build_main }}
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.cpr.outputs.pull-request-number }}
      pr-sha: ${{ steps.cpr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Update host flake locks to stable revisions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELAY_DAYS: ${{ github.event.inputs.delay_days || '7' }}
          # Outside the repo tree, so create-pull-request does not commit it.
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: bash .github/scripts/update-stable-locks.sh hosts/homelab hosts/vmk3s hosts/nixos hosts/fractal hosts/pi-4b-hh hosts/netcup-g12 hosts/hetzner-hel1

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automated/flake-lock-update
          delete-branch: true
          title: "chore: stable flake.lock update"
          commit-message: "chore: stable flake.lock update"
          body-path: ${{ runner.temp }}/pr-body.md

  # Gates the merge on the same closure `sysconf-reload` builds,
  # short of activation, which no runner can perform.
  #
  # Each host builds its `-ci` attribute,
  # which layers modules/ci-hardware-stub.nix over the placeholder hardware-configuration.nix
  # every host commits.
  #
  # nixos-ci takes longest,
  # since quickshell, nixd and lanzaboote follow nixpkgs rather than a cache of their own.
  build:
    needs: update-locks
    # always(): a skipped update-locks would skip this job too, build_main included.
    # A pull request whose pins did not change builds too:
    # that retries its failed hosts, and create-pull-request has reset its BROKEN title.
    if: always() && (inputs.build_main || needs.update-locks.outputs.pr-number != '')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: netcup-g12
            attr: netcup-g12-ci
            runner: ubuntu-latest
          - dir: hetzner-hel1
            attr: hetzner-hel1-ci
            runner: ubuntu-latest
          - dir: homelab
            attr: homelab-ci
            runner: ubuntu-latest
          - dir: vmk3s
            attr: vmk3s-ci
            runner: ubuntu-latest
          # Native aarch64 rather than emulation. Free on public repositories.
          - dir: pi-4b-hh
            attr: pi-4b-hh-ci
            runner: ubuntu-24.04-arm
          - dir: nixos
            attr: nixos-ci
            runner: ubuntu-latest
            reclaim-disk: true
          - dir: fractal
            attr: fractal-ci
            runner: ubuntu-latest
            reclaim-disk: true
    steps:
      # Full history: nix resolves a workdir flake ref through git,
      # and a shallow clone has no revision for it to read.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-locks.outputs.pr-sha || github.sha }}
          fetch-depth: 0

      # The preinstalled toolchains outweigh what is left for the store,
      # and only the nixos closure comes close to filling it.
      - name: Reclaim runner disk
        if: matrix.reclaim-disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/local/.ghcup
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Hyprland is built against its own nixpkgs pin, which no other substituter carries.
          # The system cache holds what the hosts built themselves (attic watch-store),
          # so a pin the nixos host already runs substitutes instead of rebuilding for hours.
          # The screen-sharing cache holds mirrorme,
          # built against the revision that flake pins itself,
          # so the pin this workflow moves leaves it alone (hosts/nixos/flake.nix).
          extra-conf: |
            extra-substituters = https://hyprland.cachix.org https://nix-cache.bjoernblessin.de/system https://nix-cache.bjoernblessin.de/screen-sharing
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc= system:CVw1EsxUyFB1VSHALF4GzqhjuRXjwyeyQzFOfXML+ss= screen-sharing:0wAX2u4GPUvsZmRMsjut6HjhdYfBErcjQCHTXiJ0yPM=

      # The host directories read ../../modules and ../../lib,
      # so the ref resolves against the repo root with ?dir=hosts/<dir> rather than the host directory alone.
      #
      # --no-write-lock-file: the build reads the pins the pull request carries
      # and re-locks none of them.
      #
      # --fallback: a NAR download the cache breaks off builds locally
      # in place of aborting the build.
      - name: Build ${{ matrix.attr }}
        id: build
        run: |
          out=$(nix build --no-link --print-out-paths --print-build-logs --no-write-lock-file --fallback \
            "./hosts/${{ matrix.dir }}#nixosConfigurations.${{ matrix.attr }}.config.system.build.toplevel")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # Matrix jobs share no outputs, so the merge job reads one artifact per passing host.
      - name: Record ${{ matrix.dir }} as built
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: echo "$OUT" > "$RUNNER_TEMP/${{ matrix.dir }}"

      - uses: actions/upload-artifact@v7
        with:
          name: built-${{ matrix.dir }}
          path: ${{ runner.temp }}/${{ matrix.dir }}
          retention-days: 1

      # Hosts pull from system cache (modules/attic-pull-system.nix).
      # Path missing upstream builds once here.
      # pi-4b-hh lacks RAM for some of them, grafana among them.
      # attic push skips paths cache.nixos.org signs.
      # Failed push leaves merge gate alone: hosts build what cache lacks.
      # atticd uploads ten chunks per NAR at once, each with its own buffers and zstd encoder.
      # Seven runners at the default of five NARs each drove it out of memory.
      # One connect timeout or 504 on any path fails whole push.
      # Retry re-uploads only paths still missing from cache.
      # attic-client from host's nixpkgs pin: build left its glibc and libs in store.
      # Registry nixpkgs pulls foreign closure, from system cache first by priority.
      - name: Push ${{ matrix.attr }} to the system cache
        continue-on-error: true
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          OUT: ${{ steps.build.outputs.out }}
          PUSH_ATTEMPTS: 5
          FIRST_RETRY_DELAY_SECONDS: 30
        run: |
          nix run --inputs-from "./hosts/${{ matrix.dir }}" nixpkgs#attic-client -- login hh https://nix-cache.bjoernblessin.de/ "$ATTIC_TOKEN"
          delay=$FIRST_RETRY_DELAY_SECONDS
          for attempt in $(seq "$PUSH_ATTEMPTS"); do
            if nix run --inputs-from "./hosts/${{ matrix.dir }}" nixpkgs#attic-client -- push --jobs 2 hh:system "$OUT"; then
              exit 0
            fi
            if [ "$attempt" -lt "$PUSH_ATTEMPTS" ]; then
              echo "Push attempt $attempt of $PUSH_ATTEMPTS failed, retrying in ${delay}s"
              sleep "$delay"
              delay=$((delay * 2))
            fi
          done
          echo "Push failed after $PUSH_ATTEMPTS attempts"
          exit 1

  merge:
    needs: [update-locks, build]
    # !cancelled(): a failed host must not stop the passing ones from landing.
    if: ${{ !cancelled() && needs.update-locks.outputs.pr-number != '' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: land-built-hosts.sh diffs the pull request against origin/main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-locks.outputs.pr-sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: built-*
          path: built
          merge-multiple: true

      # Merges without waiting on branch protection checks,
      # which the build job above has already stood in for.
      - name: Land the hosts that built
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.update-locks.outputs.pr-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/land-built-hosts.sh built
