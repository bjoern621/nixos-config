name: Export host closure

# Builds one host on a native runner and uploads what cache.nixos.org lacks
# as a signed file:// binary cache artifact.
# Stands in for the system Attic cache while that cache is down,
# for a host too small to build its own closure (pi-4b-hh and grafana).
#
# Signing key lives for one run only. Its public half ships in the artifact.
# On the host, after `gh run download <run> -n closure-<host> -D ~/closure-export`:
#   sudo nixos-rebuild switch --flake ~/git/nixos-config/hosts/<host> \
#     --option extra-substituters "file://$HOME/closure-export/cache" \
#     --option extra-trusted-public-keys "$(cat ~/closure-export/key.pub)"

on:
  workflow_dispatch:
    inputs:
      host:
        description: "Host to build"
        type: choice
        options:
          - pi-4b-hh
          - homelab
          - vmk3s
          - netcup-g12
          - hetzner-hel1
          - nixos
          - fractal

permissions:
  contents: read

jobs:
  export:
    # Native aarch64 for pi-4b-hh rather than emulation.
    runs-on: ${{ inputs.host == 'pi-4b-hh' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      # Full history: nix resolves a workdir flake ref through git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same reason as in update-flake-locks.yml: the nixos closure fills the runner disk.
      - name: Reclaim runner disk
        if: inputs.host == 'nixos' || inputs.host == 'fractal'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm /usr/local/.ghcup

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build ${{ inputs.host }}-ci
        id: build
        run: |
          out=$(nix build --no-link --print-out-paths --print-build-logs --fallback \
            "./hosts/${{ inputs.host }}#nixosConfigurations.${{ inputs.host }}-ci.config.system.build.toplevel")
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # Paths carrying the cache.nixos.org-1 signature come from there on the host as well.
      - name: Sign and export paths missing upstream
        env:
          OUT: ${{ steps.build.outputs.out }}
        run: |
          export_dir="$RUNNER_TEMP/export"
          mkdir -p "$export_dir"
          nix key generate-secret --key-name "export-${{ github.run_id }}" > "$RUNNER_TEMP/key.sec"
          nix key convert-secret-to-public < "$RUNNER_TEMP/key.sec" > "$export_dir/key.pub"
          nix path-info --recursive --sigs "$OUT" \
            | grep -v 'cache\.nixos\.org-1:' | awk '{print $1}' > "$RUNNER_TEMP/paths"
          wc -l < "$RUNNER_TEMP/paths"
          # secret-key signs each narinfo on write.
          xargs nix copy \
            --to "file://$export_dir/cache?compression=zstd&secret-key=$RUNNER_TEMP/key.sec" \
            < "$RUNNER_TEMP/paths"
          du -sh "$export_dir"

      - uses: actions/upload-artifact@v4
        with:
          name: closure-${{ inputs.host }}
          path: ${{ runner.temp }}/export
          retention-days: 3
          # Already zstd.
          compression-level: 0
